; LilyGo T-Display-P4 V1.0 (ESP32-P4 + ESP32-C6 hosted radio + SX1262)
[env:t-display-p4]
custom_meshtastic_hw_model = 0
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = esp32-p4
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = LILYGO T-Display-P4
custom_meshtastic_tags = LilyGo
custom_meshtastic_requires_dfu = false
custom_meshtastic_partition_scheme = 16MB

extends = esp32p4_base
board = lilygo-t-display-p4
board_level = extra
board_build.partitions = default_16MB.csv
upload_protocol = esptool

build_src_filter =
  ${esp32p4_base.build_src_filter}
  +<../variants/esp32p4/t-display-p4>

build_flags =
  ${esp32p4_base.build_flags}
  -D T_DISPLAY_P4
  -D BOARD_HAS_PSRAM
  -I variants/esp32p4/t-display-p4
